name: Release

# Manual release from the tip of v0.7. Picks the next 0.7.x version, writes the changelog with
# git-cliff (cliff.toml) and commits it to v0.7, tags and creates the GitHub Release, builds and
# attaches the DMG, and bumps the Homebrew cask. The fork stays on 0.7.x for good: upstream's 0.8
# is a redesign, so the minor version never moves.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "stable: next 0.7.x patch. beta: next 0.7.x-beta.N pre-release."
        required: true
        default: stable
        type: choice
        options: [stable, beta]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v0.7
          fetch-depth: 0

      - name: Pick the version
        id: meta
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          LAST_STABLE="$(git tag -l 'v0.7.*' | grep -E '^v0\.7\.[0-9]+$' | sort -V | tail -1)"
          NEXT="0.7.$(( ${LAST_STABLE##*.} + 1 ))"
          LAST_BETA="$(git tag -l "v$NEXT-beta.*" | sort -V | tail -1)"
          if [ "$CHANNEL" = beta ]; then
            VERSION="$NEXT-beta.$(( ${LAST_BETA##*.} + 1 ))"
            # Betas span from the previous beta in this lane, or the last stable for the first one.
            PREV="${LAST_BETA:-$LAST_STABLE}"
            PRERELEASE=true
          else
            VERSION="$NEXT"
            # Stables span from the last stable, rolling up the whole beta series.
            PREV="$LAST_STABLE"
            PRERELEASE=false
          fi
          {
            echo "tag=v$VERSION"
            echo "version=$VERSION"
            echo "prev=$PREV"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          if [ "$(git rev-list --count "$PREV..HEAD")" -eq 0 ]; then
            echo "::error::No commits on v0.7 since $PREV"
            exit 1
          fi
          echo "Releasing v$VERSION (changes since $PREV)" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Stable notes ignore beta tags so they cover everything since the last stable.
          args: >-
            ${{ steps.meta.outputs.prev }}..HEAD --tag ${{ steps.meta.outputs.tag }}
            ${{ inputs.channel == 'stable' && '--ignore-tags beta' || '' }}
        env:
          OUTPUT: notes.md
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit the changelog, tag, and create the release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          # Insert the new section right after the "# Changelog" header.
          { echo "# Changelog"; echo; cat notes.md; echo; tail -n +2 CHANGELOG.md | sed '/./,$!d'; } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: changelog for $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:v0.7 "$TAG"
          FLAGS=(--latest)
          [ "$PRERELEASE" = true ] && FLAGS=(--prerelease --latest=false)
          gh release create "$TAG" --verify-tag --title "OpenUsage $VERSION" --notes-file notes.md "${FLAGS[@]}"

  build:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-dmg.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}

  homebrew:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # Betas bump only openusage@beta. Stables bump both casks, so beta users never sit on an older
      # beta after its stable ships.
      CASKS: ${{ inputs.channel == 'stable' && 'openusage openusage@beta' || 'openusage@beta' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: manojkarthick/homebrew-tap
          # Fine-grained PAT with Contents read/write on manojkarthick/homebrew-tap only.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump the casks
        run: |
          SHA256="$(gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "OpenUsage-$VERSION.dmg" -O - | sha256sum | cut -d' ' -f1)"
          for cask in $CASKS; do
            sed -i -E \
              -e "s/^  version \"[^\"]+\"/  version \"$VERSION\"/" \
              -e "s/^  sha256 \"[^\"]+\"/  sha256 \"$SHA256\"/" \
              "Casks/$cask.rb"
            grep -q "version \"$VERSION\"" "Casks/$cask.rb"
            grep -q "sha256 \"$SHA256\"" "Casks/$cask.rb"
          done

      - name: Push to the tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${CASKS// /, } $VERSION"
          git push
